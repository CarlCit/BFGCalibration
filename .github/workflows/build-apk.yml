name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Pre-install NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --channel=3 "ndk;29.0.13846066" || sdkmanager --channel=1 "ndk;29.0.13846066" || sdkmanager "ndk;29.0.13846066" || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFG-Calibration-Debug-APKs
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
